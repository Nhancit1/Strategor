services:
  mongo:
    image: mongo:7
    # No host port published: the backend reaches mongo over the internal
    # compose network. Avoids port clashes when several stacks share a server.
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/strategor
      - AI_SERVICE_URL=http://ai-python:8000
      - SELF_URL=http://backend-node:4000
      - PORT=4000
      - NODE_ENV=production
    # Exposed on localhost only; the system nginx reverse-proxies /api and
    # /socket.io to this port. Set BACKEND_PORT per environment in .env.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads_volume:/tmp/strategor-uploads
    depends_on:
      - mongo
    restart: unless-stopped

  ai-python:
    build:
      context: ./ai-python
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_URL=http://backend-node:4000
    volumes:
      - uploads_volume:/tmp/strategor-uploads
    depends_on:
      - backend-node
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Exposed on localhost only; the system nginx reverse-proxies / (the SPA)
    # to this port. Set FRONTEND_PORT per environment in .env.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend-node
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_volume:
