services:
  mongo:
    image: mongo:7
    container_name: strategor-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: strategor-backend
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/strategor
      - AI_SERVICE_URL=http://ai-python:8000
      - SELF_URL=http://backend-node:4000
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - uploads_volume:/tmp/strategor-uploads
    depends_on:
      - mongo
    restart: unless-stopped

  ai-python:
    build:
      context: ./ai-python
      dockerfile: Dockerfile
    container_name: strategor-ai
    env_file:
      - .env
    environment:
      - NODE_URL=http://backend-node:4000
    volumes:
      - uploads_volume:/tmp/strategor-uploads
    depends_on:
      - backend-node
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strategor-frontend
    depends_on:
      - backend-node
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: strategor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-node
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_volume:
