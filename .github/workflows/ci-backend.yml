name: CI Backend

# Runs only when the Node backend changes.
on:
  push:
    branches: [main]
    paths:
      - "backend-node/**"
  pull_request:
    branches: [main]
    paths:
      - "backend-node/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & check (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json
      - name: Install (ci)
        working-directory: backend-node
        run: npm ci
      - name: Security audit (npm, HIGH)
        working-directory: backend-node
        run: npm audit --audit-level=high
      - name: Syntax-check all source files
        working-directory: backend-node
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Tests (if present)
        working-directory: backend-node
        run: npm test --if-present
