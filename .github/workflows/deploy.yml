name: CD Deploy

# Deploys the full stack to the VPS via Docker Compose.
# Triggered manually, or automatically after the CI + Security workflows succeed on main.
#
# Required repository secrets:
#   VPS_HOST          - server IP / hostname
#   VPS_USER          - SSH user
#   SSH_PRIVATE_KEY   - private key authorised on the VPS
#   DEPLOY_PATH       - absolute path of the project on the VPS (e.g. /opt/strategor)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Backend", "CI Frontend", "CI AI Python", "Security"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    # Manual run, or only when the triggering workflow actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Pulling latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building images"
            docker compose build

            echo "==> Starting stack (zero-ish downtime per service)"
            docker compose up -d --remove-orphans

            echo "==> Waiting for backend health"
            ok=0
            for i in $(seq 1 12); do
              sleep 5
              if curl -fsS http://localhost/api/health >/dev/null 2>&1 \
                 || curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
                ok=1; echo "Backend healthy (attempt $i)"; break
              fi
              echo "Health check $i/12 ..."
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::Backend did not become healthy — recent logs:"
              docker compose logs --tail=80 backend-node || true
              exit 1
            fi

            echo "==> Pruning old images"
            docker image prune -f || true
            echo "Deploy complete: $(git log --oneline -1)"
