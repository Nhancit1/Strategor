name: CD Deploy

# Deploys the full stack to the right VPS via Docker Compose, based on the branch:
#   dev       -> environment "dev"        (Server A, non-prod)
#   pre-prod  -> environment "preprod"    (Server A, non-prod)
#   main      -> environment "production" (Server B, requires manual approval)
#
# Triggered manually, or automatically once ALL the CI + Security runs of a pushed
# commit have succeeded (one deploy per commit, see the "gate" step).
#
# Per-environment secrets (configured under Settings -> Environments):
#   VPS_HOST          - server IP / hostname
#   VPS_USER          - SSH user
#   SSH_PRIVATE_KEY   - private key authorised on the VPS
#   DEPLOY_PATH       - absolute path of the project on the VPS (e.g. /opt/strategor-dev)
#   COMPOSE_PROJECT   - (optional) docker compose project name, isolates stacks sharing a server
#   HEALTH_URL        - (optional) health endpoint to poll (defaults to localhost checks)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Backend", "CI Frontend", "CI AI Python", "Security"]
    types: [completed]
    branches: [main, pre-prod, dev]

permissions:
  contents: read
  actions: read # the gate below lists the CI/Security runs of the commit

jobs:
  # Map the triggering branch to a GitHub environment. Kept separate so the
  # environment protection (manual approval on production) gates the deploy job.
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    # Manual run, or a successful run triggered by a push (pull requests never deploy).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      branch: ${{ steps.map.outputs.branch }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: map
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ github.ref_name }}"
          else
            BR="${{ github.event.workflow_run.head_branch }}"
          fi

          case "$BR" in
            main)     ENV=production ;;
            pre-prod) ENV=preprod ;;
            dev)      ENV=dev ;;
            *) echo "::error::Branch '$BR' is not deployable"; exit 1 ;;
          esac

          echo "Branch '$BR' -> environment '$ENV'"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

      # One push fires up to 4 workflow_run events (one per CI/Security workflow), which
      # used to start 4 concurrent deploys of the same commit. Deploy only when EVERY
      # CI/Security run of this commit has finished green: earlier events skip, and the
      # last run to finish deploys. Path-filtered CIs that did not run are not awaited.
      - id: gate
        name: Wait for all CI/Security runs of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ steps.map.outputs.branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: deploying without waiting for CI."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&branch=$BRANCH&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.name == "CI Backend" or .name == "CI Frontend"
                            or .name == "CI AI Python" or .name == "Security")
                   | {name, status, conclusion}]')
          echo "CI/Security runs for $SHA:"
          echo "$runs" | jq -r '.[] | "  - \(.name): \(.status) / \(.conclusion // "-")"'

          pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
          failed=$(echo "$runs" | jq '[.[] | select(.status == "completed"
                                        and .conclusion != "success"
                                        and .conclusion != "skipped")] | length')

          if [ "$failed" -gt 0 ]; then
            echo "::warning::Not deploying $SHA: at least one CI/Security run did not succeed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::$pending CI/Security run(s) still running for $SHA; the last one to finish will deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "All CI/Security runs succeeded: deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (${{ needs.resolve.outputs.environment }})
    needs: resolve
    if: ${{ needs.resolve.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # Never run two deploys of the same environment at once (they share one checkout
    # and one compose project on the VPS). Queue instead of cancelling a half-done deploy.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    # Selecting the environment activates its secrets AND any required-reviewer
    # protection rule (production waits for manual approval here).
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      DEPLOY_BRANCH: ${{ needs.resolve.outputs.branch }}
      COMPOSE_PROJECT: ${{ secrets.COMPOSE_PROJECT }}
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: DEPLOY_BRANCH,COMPOSE_PROJECT,HEALTH_URL
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Use an explicit project name when provided, so two stacks can
            # share one server (e.g. dev + pre-prod) without colliding.
            COMPOSE="docker compose ${COMPOSE_PROJECT:+-p $COMPOSE_PROJECT}"

            echo "==> Pulling latest $DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "==> Building images"
            $COMPOSE build

            echo "==> Starting stack (zero-ish downtime per service)"
            $COMPOSE up -d --remove-orphans

            echo "==> Waiting for backend health"
            ok=0
            for i in $(seq 1 12); do
              sleep 5
              if [ -n "$HEALTH_URL" ]; then
                curl -fsS "$HEALTH_URL" >/dev/null 2>&1 && { ok=1; echo "Backend healthy (attempt $i)"; break; }
              elif curl -fsS http://localhost/api/health >/dev/null 2>&1 \
                   || curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
                ok=1; echo "Backend healthy (attempt $i)"; break
              fi
              echo "Health check $i/12 ..."
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::Backend did not become healthy — recent logs:"
              $COMPOSE logs --tail=80 backend-node || true
              exit 1
            fi

            echo "==> Pruning old images"
            docker image prune -f || true
            echo "Deploy complete ($DEPLOY_BRANCH): $(git log --oneline -1)"
