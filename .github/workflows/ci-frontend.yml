name: CI Frontend

# Runs only when the React/Vite frontend changes.
on:
  push:
    branches: [main, pre-prod, dev]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, pre-prod, dev]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & lint (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install (ci)
        working-directory: frontend
        run: npm ci
      - name: Security audit (npm, HIGH)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint (if present)
        working-directory: frontend
        run: npm run lint --if-present
      - name: Build
        working-directory: frontend
        run: npm run build
