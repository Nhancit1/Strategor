name: Security

# Cross-cutting security gate (NOT tied to a single component).
# Per-component dependency audits live in each ci-*.yml (npm audit / pip-audit).
# Here we run only repo-wide scans: leaked secrets, Dockerfile lint, filesystem CVE/misconfig.

on:
  push:
    branches: [main, pre-prod, dev]
  pull_request:
    branches: [main, pre-prod, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history so leaked-then-removed secrets are caught
      # Use the free open-source gitleaks BINARY (MIT) instead of gitleaks-action@v2,
      # which now requires a paid GITLEAKS_LICENSE for GitHub organizations.
      # Same scan (full git history), no license needed.
      - name: Gitleaks (free CLI)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1 --verbose

  dockerfile-lint:
    name: Hadolint (${{ matrix.df }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        df: [backend-node/Dockerfile, frontend/Dockerfile, ai-python/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.df }}
          failure-threshold: warning

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # trivy-action@v0.28.0 internally pins setup-trivy@v0.2.1, a tag Aqua
      # deleted, so the composite action no longer resolves. Install the Trivy
      # binary directly instead — same scan, no broken action dependency.
      - name: Trivy (vuln + secret + misconfig)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.72.0
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .
