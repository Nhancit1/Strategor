name: Security

# Cross-cutting security gate (NOT tied to a single component).
# Per-component dependency audits live in each ci-*.yml (npm audit / pip-audit).
# Here we run only repo-wide scans: leaked secrets, Dockerfile lint, filesystem CVE/misconfig.

on:
  push:
    branches: [main, pre-prod, dev]
  pull_request:
    branches: [main, pre-prod, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history so leaked-then-removed secrets are caught
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dockerfile-lint:
    name: Hadolint (${{ matrix.df }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        df: [backend-node/Dockerfile, frontend/Dockerfile, ai-python/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.df }}
          failure-threshold: warning

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
