server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Strip /app2 prefix for static assets and fallback
  rewrite ^/app2/(.*)$ /$1 last;

  # Cache aggressif sur les assets versionnés
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback SPA pour le routing client
  location / {
    try_files $uri $uri/ /index.html;
  }
}
